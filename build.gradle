plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.palantir.git-version' version '3.4.0'
}

group 'com.gremlin'

// Version comes from the git tag, not a hand-maintained constant, so it can
// never drift from the tag a release is cut from. HEAD exactly on a semver
// tag like "v1.2.3" (and clean) -> "1.2.3", published to
// s3://maven.gremlin.com. Anything else (main between releases, or a tag
// that isn't full semver) -> "<describe>-SNAPSHOT", which routes to
// s3://maven.staging.gremlin.com below. Release tags must be full semver
// (MAJOR.MINOR.PATCH, e.g. "v1.3.0") going forward -- the old "v1.2"
// shorthand no longer qualifies as a release tag.
def gitDetails = versionDetails()
def semverPattern = /v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*)?(?:\+[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*)?/
def isReleaseTag = gitDetails.lastTag ==~ semverPattern
version = (isReleaseTag && gitDetails.isCleanTag) \
    ? gitDetails.lastTag.substring(1) \
    : "${gitVersion().replaceFirst(/^v/, '')}-SNAPSHOT"

repositories {
    mavenCentral()
    maven { url "https://plugins.gradle.org/m2/" }
}

java {
    withSourcesJar()
    withJavadocJar()
}

// options.release (not sourceCompatibility/targetCompatibility) both sets the
// output bytecode version AND validates against the real Java 8 API surface,
// so building with a newer JDK can't accidentally call an API that doesn't
// exist on an actual Java 8 runtime.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}


dependencies {
    implementation 'org.yaml:snakeyaml:1.33'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-simple:2.0.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    //testImplementation 'junit:junit:4.13'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation 'org.mockito:mockito-core:2.23.0'
    testImplementation 'com.github.tomakehurst:wiremock-standalone:2.27.2'
}

test {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = "com.gremlin"
            artifactId = "failure-flags-java"
            from components.java

            pom {
                name = 'Failure Flags Java library'
                description = 'A Java library to inject failures in your application dependencies'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            authentication {
                awsIm(AwsImAuthentication)
            }
            if(project.version.endsWith('-SNAPSHOT')) {
                url "s3://maven.staging.gremlin.com"
            } else {
                url "s3://maven.gremlin.com"
            }
        }
    }
}
